

services:

  migrate-auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.dev
    command: npm run migrate
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_auth
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network
    profiles:
      - migrate

  migrate-fleet:
    build:
      context: ./services/fleet-service
      dockerfile: Dockerfile.dev
    command: npm run migrate
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_fleet
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/fleet-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network
    profiles:
      - migrate

  migrate-trip:
    build:
      context: ./services/trip-service
      dockerfile: Dockerfile.dev
    command: npm run migrate
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_trip
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/trip-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network
    profiles:
      - migrate


  migrate-analytics:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile.dev
    command: npm run migrate
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_analytics
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/analytics-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network
    profiles:
      - migrate

  seed-auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.dev
    command: npm run seed
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_auth
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network
    profiles:
      - seed

  seed-fleet:
    build:
      context: ./services/fleet-service
      dockerfile: Dockerfile.dev
    command: npm run seed
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_fleet
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/fleet-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network
    profiles:
      - seed

  seed-trip:
    build:
      context: ./services/trip-service
      dockerfile: Dockerfile.dev
    command: npm run seed
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_trip
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    depends_on:
      postgres:
        condition: service_healthy
      migrate-trip:
        condition: service_completed_successfully
    networks:
      - transitops-network
    profiles:
      - seed

  seed-analytics:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile.dev
    command: npm run seed
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_analytics
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    depends_on:
      - postgres
      - migrate-analytics
    networks:
      - transitops-network
    profiles:
      - seed
  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port
    volumes:
      - ./gateway:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      auth-service:
        condition: service_started
      fleet-service:
        condition: service_started
      trip-service:
        condition: service_started
      analytics-service:
        condition: service_started
    networks:
      - transitops-network

  # Services with hot-reload
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "9230:9229"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_auth
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network

  fleet-service:
    build:
      context: ./services/fleet-service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3002:3002"
      - "9231:9229"
    volumes:
      - ./services/fleet-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_fleet
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/fleet-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network

  trip-service:
    build:
      context: ./services/trip-service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "9232:9229"
    volumes:
      - ./services/trip-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_trip
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/trip-service/.env

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3004:3004"
      - "9233:9229"
    volumes:
      - ./services/analytics-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitops_analytics
      - DB_USER=transitops
      - DB_PASSWORD=transitops123
    env_file:
      - services/analytics-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network

  # PostgreSQL with multiple databases
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U transitops -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      - POSTGRES_USER=transitops
      - POSTGRES_PASSWORD=transitops123
      - POSTGRES_MULTIPLE_DATABASES=transitops_auth,transitops_fleet,transitops_trip,transitops_analytics
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/database/migration.sql:/docker-entrypoint-initdb.d/migration.sql
      - ./infrastructure/database/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - ./infrastructure/database/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    ports:
      - "5432:5432"
    networks:
      - transitops-network

  # Adminer for database management
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transitops-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - transitops-network
    restart: unless-stopped
    volumes:
      - redis_data:/data

networks:
  transitops-network:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data:
